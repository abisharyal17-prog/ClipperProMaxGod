[project]
name = "clipper"
version = "0.1.0"
description = "Modular, node-graph video clipper for short-form (Shorts/Reels/TikTok)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "orjson>=3.10",
    "numpy>=1.26",
    "pysubs2>=1.7",
    "Pillow>=10.3",
    "Jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "faster-whisper>=1.0.3",
    "whisperx>=3.3.1",
    "ultralytics>=8.2",
    "supervision>=0.22",
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
    "librosa>=0.10",
    "soundfile>=0.12",
    "onnxruntime>=1.18",
    "filterpy>=1.4.5",
    "av>=12.0",
    "scenedetect>=0.6.4",
    "silero-vad>=5.1",
    # ctranslate2 / faster-whisper still import pkg_resources, which setuptools
    # removed in 81+. Pin below that or transcription fails at import time.
    "setuptools<81",
]
desktop = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "fonttools>=4.50",
]

[project.scripts]
clipper = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
